name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate static site
        run: npm run generate
        env:
          NUXT_APP_BASE_URL: /gitreader-landing/
          NUXT_TELEMETRY_DISABLED: "1"
          NUXT_PUBLIC_COMMERCIAL_API_BASE_URL: ${{ vars.GITREADER_COMMERCIAL_API_BASE_URL }}
          NUXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.GITREADER_TURNSTILE_SITE_KEY }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
